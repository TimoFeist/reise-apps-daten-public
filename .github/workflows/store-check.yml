# Prüft jeden Montag alle Paketnamen bei Google Play und schreibt Auffälligkeiten nach queue/store-pruefung.json.
name: Store-Prüfung

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prüfen und hochladen
        run: |
          python3 tools/store_check.py
          git config user.name "reise-apps-bot"
          git config user.email "reise-apps-bot@users.noreply.github.com"
          if git diff --quiet queue/store-pruefung.json 2>/dev/null && ! git status --porcelain | grep -q store-pruefung; then echo "Keine Änderung"; exit 0; fi
          git add queue/store-pruefung.json
          git commit -qm "Store-Prüfung $(date +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin main && exit 0; sleep $((i*10)); done
          exit 1

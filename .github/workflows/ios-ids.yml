# Täglich: Feiertage (wöchentlich neu), Koordinaten neuer Städte, fehlende Paketnamen, Leihrad-/Scooter-/Carsharing-Systeme (GBFS), Logo-Adressen aus Google Play, iPhone-Version zu bis zu 1200 Apps; dann data.json neu bauen.
name: iPhone-Apps zuordnen

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: merge-data
  cancel-in-progress: false

jobs:
  ios:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pycountry
      - name: Feiertage und Stadt-Koordinaten
        run: |
          python3 tools/feiertage.py || true
          timeout 30m python3 tools/city_geo.py || true
          timeout 40m python3 tools/pkg_suche.py 400 || true
          timeout 15m python3 tools/gbfs.py || true
          timeout 60m python3 tools/icons.py || true
      - name: Zuordnen
        run: timeout 240m python3 tools/ios_ids.py 1200 || true
      - name: Hochladen
        run: |
          git config user.name "reise-apps-bot"
          git config user.email "reise-apps-bot@users.noreply.github.com"
          mkdir -p /tmp/neu && cp info/ios.json info/feiertage.json info/stadt-koordinaten.json info/icons.json info/pkg.json info/gbfs.json /tmp/neu/ 2>/dev/null || true
          cp queue/pkg-pruefung.json /tmp/neu-pruefung.json 2>/dev/null || true
          for i in 1 2 3 4 5; do
            git reset -q --hard
            git pull -q --rebase origin main
            cp /tmp/neu/*.json info/
            cp /tmp/neu-pruefung.json queue/pkg-pruefung.json 2>/dev/null || true
            python3 merge_raw.py
            git add info/*.json data.json queue/pkg-pruefung.json
            if git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
            git commit -qm "iPhone-Apps zugeordnet $(date +%F)"
            if git push -q origin main; then echo "Hochgeladen"; exit 0; fi
            sleep $((i*10))
          done
          exit 1
